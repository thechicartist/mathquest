<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScribbleSum — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="corequest-icon.svg">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Site footer — matches parent.html footer styling exactly. */
  .site-footer{
    position:fixed; left:0; bottom:0; width:100%; box-sizing:border-box;
    background:#2D2A26; color:#EDE7DA;
    padding:14px 16px calc(10px + env(safe-area-inset-bottom));
    font-family:'Nunito',sans-serif; z-index:10;
  }
  .footer-inner{
    max-width:760px; margin:0 auto; display:flex; flex-wrap:wrap;
    align-items:center; justify-content:space-between; gap:8px 20px;
  }
  .footer-brand{ font-family:'Fredoka One',cursive; font-size:0.95rem; color:#fff; white-space:nowrap; }
  .footer-links{ display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; }
  .footer-links a{ color:#EDE7DA; text-decoration:none; font-weight:700; font-size:0.82rem; white-space:nowrap; }
  .footer-links a:hover{ color:#FF8A3D; text-decoration:underline; }
  .footer-copy{ font-size:0.72rem; color:#B7AF9D; font-weight:600; text-align:center; width:100%; order:3; }
  @media (min-width:560px){ .footer-copy{ width:auto; order:0; text-align:left; } }
  @media (max-width:559px){ .footer-inner{ justify-content:center; text-align:center; } }
  body{ padding-bottom:70px !important; }
</style>
</head>
<body>

<button class="student-btn" onclick="location.href='index.html'">👦 Student</button>
<button class="parent-btn" onclick="location.href='parent.html'">👨‍👩‍👧‍👦 Parents</button>
<button class="edu-btn" onclick="location.href='educator.html'">🎓 Educators</button>

<div class="login-card">
  <img src="scribblesum-logo.svg" alt="ScribbleSum logo" width="350">
  <div class="login-subtitle">Your math adventure awaits!</div>

  <div class="login-field">
    <label>Username</label>
    <input type="text" id="login-username" placeholder="Enter your username" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="login-field">
    <label>Password</label>
    <input type="password" id="login-password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="login-btn" onclick="doLogin()">🚀 Let's Go!</button>
  <div class="login-err" id="login-err"></div>

  <div style="margin-top:20px;padding-top:16px;border-top:2px solid #F5F5F5;text-align:center;font-size:0.82rem;color:#B0BEC5;font-weight:600">
    🎓 Accounts are created by your educator or parent
  </div>

<script src="js/api.js"></script>
<script>
async function doLogin(){
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const err = document.getElementById('login-err');
  if(!u||!p){ err.textContent='Please fill in both fields!'; return; }
  err.style.color='#43A047'; err.textContent='Checking... ⏳';
  const userData = await apiGet('/user/'+encodeURIComponent(u));
  if(!userData || userData.error){ err.style.color='#E53935'; err.textContent='Username not found. Ask your educator or parent!'; return; }
  if(userData.password !== btoa(p)){ err.style.color='#E53935'; err.textContent='Wrong password. Try again!'; return; }
  // Save session and go to game
  sessionStorage.setItem('mq_user', JSON.stringify({username:u, ...userData}));
  location.href = 'math.html';
}
</script>
  <link rel="stylesheet" href="css/style.css">

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-brand">✏️ ScribbleSum</span>
      <nav class="footer-links">
        <a href="faq.html">FAQ</a>
        <a href="terms.html">Terms &amp; Conditions</a>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLScMfZEoUwNTG7IMQwNQ-2kPQI55CNcOrOu_kVzozkvgfpZPWg/viewform" target="_blank" rel="noopener">Contact</a>
      </nav>
      <span class="footer-copy">© 2026 ScribbleSum. All rights reserved.</span>
    </div>
  </footer>
</body>
</html>
